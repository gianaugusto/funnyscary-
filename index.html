<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#100d16">
    <meta
      name="description"
      content="Entre no universo Scary Go Funny: vídeos de terror, humor e sustos no YouTube, TikTok e Instagram."
    >
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://gianaugusto.github.io/funnyscary-/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:site_name" content="Scary Go Funny">
    <meta property="og:title" content="Scary Go Funny | Terror, humor e sustos">
    <meta
      property="og:description"
      content="Siga Scary Go Funny e encontre vídeos de terror, humor e sustos nas redes sociais."
    >
    <meta property="og:url" content="https://gianaugusto.github.io/funnyscary-/">
    <meta name="twitter:card" content="summary">
    <title>Scary Go Funny | Terror, humor e sustos</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Scary Go Funny",
        "url": "https://gianaugusto.github.io/funnyscary-/",
        "description": "Conteúdo de terror, humor e sustos.",
        "sameAs": [
          "https://www.youtube.com/@scary-go-funny",
          "https://www.tiktok.com/@scarygofunny",
          "https://www.instagram.com/scarygofunny/"
        ]
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #100d16;
        color: #f8f4fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 50% 5%, rgb(114 51 151 / 23%), transparent 42rem),
          #100d16;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 48px 20px 32px;
      }

      .profile {
        width: min(100%, 440px);
        text-align: center;
      }

      .avatar {
        display: grid;
        width: 104px;
        height: 104px;
        margin: 0 auto 22px;
        place-items: center;
        border: 1px solid rgb(236 188 255 / 45%);
        border-radius: 50%;
        background: linear-gradient(145deg, #51276a, #21152d 72%);
        box-shadow: 0 0 42px rgb(191 87 255 / 20%);
        font-size: 52px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 2.65rem);
        font-weight: 800;
        letter-spacing: -0.055em;
        line-height: 1.1;
      }

      .handle {
        margin: 9px 0 0;
        color: #d2b3df;
        font-size: 0.98rem;
      }

      .intro {
        margin: 18px auto 28px;
        color: #c8bfce;
        font-size: 1rem;
        line-height: 1.65;
      }

      .links {
        display: grid;
        gap: 13px;
      }

      .social-link {
        display: flex;
        min-height: 60px;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 14px 20px;
        border: 1px solid #483451;
        border-radius: 15px;
        background: rgb(35 26 43 / 88%);
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
        transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
      }

      .social-link:hover {
        transform: translateY(-2px);
        border-color: #d7a1f2;
        background: #30203a;
      }

      .social-link:focus-visible {
        outline: 3px solid #e7b5ff;
        outline-offset: 4px;
      }

      .social-link svg {
        width: 21px;
        height: 21px;
        flex: 0 0 auto;
        fill: currentColor;
      }

      .tagline {
        margin: 28px 0 0;
        color: #95899d;
        font-size: 0.88rem;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="profile" aria-labelledby="profile-name">
        <div class="avatar" aria-hidden="true">👻</div>
        <h1 id="profile-name">Scary Go Funny</h1>
        <p class="handle">@scarygofunny</p>
        <p class="intro">
          Terror, humor e sustos na medida certa. Escolha sua rede e venha se assustar com a gente!
        </p>

        <nav class="links" aria-label="Redes sociais de Scary Go Funny">
          <a
            class="social-link"
            href="https://www.youtube.com/@scary-go-funny"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Scary Go Funny no YouTube (abre em nova aba)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.2 3.6-6.2 3.6Z"></path>
            </svg>
            YouTube
          </a>
          <a
            class="social-link"
            href="https://www.tiktok.com/@scarygofunny"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Scary Go Funny no TikTok (abre em nova aba)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19.6 6.3a5.6 5.6 0 0 1-3.4-4.6V1h-4.2v15a3.1 3.1 0 1 1-3.1-3.1c.4 0 .8.1 1.1.2V8.8a7.3 7.3 0 1 0 6.2 7.2V8.4a9.7 9.7 0 0 0 5.7 1.9V6.1c-.8 0-1.6-.2-2.3-.6Z"></path>
            </svg>
            TikTok
          </a>
          <a
            class="social-link"
            href="https://www.instagram.com/scarygofunny/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Scary Go Funny no Instagram (abre em nova aba)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7Zm5 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm5.2-3.5a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4Z"></path>
            </svg>
            Instagram
          </a>
        </nav>

        <p class="tagline">Siga, compartilhe e não assista no escuro… 👀</p>
      </section>
    </main>
  </body>
</html>
